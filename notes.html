<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes — Tanjeel Rahman</title>
  <meta name="description" content="Physics study notes and formula sheets by Tanjeel Rahman, organized by subject." />
  <style>
    :root {
      --bg: #040406;
      --bg-card: rgba(14, 12, 10, 0.74);
      --border: rgba(245, 176, 65, 0.2);
      --text: #f3efe6;
      --text-muted: #aba092;
      --accent: #f5a623;
      --accent-bright: #ffd17a;
      --accent-soft: rgba(245, 166, 35, 0.14);
      --max-w: 840px;
      --radius: 12px;
    }

    [data-theme="light"] {
      --bg: #fbf9f5;
      --bg-card: rgba(255, 253, 249, 0.84);
      --border: rgba(180, 83, 9, 0.18);
      --text: #1c1917;
      --text-muted: #57534e;
      --accent: #c26a0a;
      --accent-bright: #9a3412;
      --accent-soft: rgba(194, 106, 10, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      transition: background-color 0.25s ease, color 0.25s ease;
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.24s ease;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-bright);
      text-decoration: underline;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      font-size: 0.9rem;
    }

    .nav-links a {
      color: var(--text-muted);
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
      text-decoration: none;
    }

    .nav-links a.active {
      color: var(--accent);
      font-weight: 600;
      position: relative;
    }

    .nav-links a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 2px;
      border-radius: 2px;
      background: var(--accent);
    }

    .theme-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: inherit;
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    .theme-btn:hover {
      border-color: var(--accent);
    }

    /* Main Layout */
    main {
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      flex: 1;
    }

    section {
      padding: 2.25rem 0 0.75rem;
    }

    h2 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 1.35rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    /* Compact Page Header */
    .hero {
      padding-top: 3.75rem;
      padding-bottom: 1.25rem;
    }

    .hero-tag {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(245, 166, 35, 0.28);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 2.85rem);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.75);
    }

    [data-theme="light"] .hero h1 {
      text-shadow: none;
    }

    .hero-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 580px;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.7);
    }

    [data-theme="light"] .hero-subtitle {
      text-shadow: none;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.55rem 1.15rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      backdrop-filter: blur(8px);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--text);
      text-decoration: none;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #0b0906;
      font-weight: 600;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(245, 166, 35, 0.3);
    }

    .btn-primary:hover {
      background: var(--accent-bright);
      border-color: var(--accent-bright);
      color: #0b0906;
    }

    .btn-sm {
      padding: 0.4rem 0.85rem;
      font-size: 0.83rem;
      border-radius: 7px;
    }

    .meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* Notes Section */
    .notes-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-bottom: 1.35rem;
    }

    .notes-tab {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.48rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      backdrop-filter: blur(12px);
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .notes-tab:hover {
      border-color: var(--accent);
      color: var(--text);
      transform: translateY(-1px);
    }

    .notes-tab.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-bright);
      box-shadow: 0 0 18px rgba(245, 166, 35, 0.18);
    }

    [data-theme="light"] .notes-tab.active {
      color: var(--accent);
      box-shadow: 0 0 12px rgba(194, 106, 10, 0.12);
    }

    .notes-tab-count {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.75rem;
      padding: 0.05rem 0.42rem;
      border-radius: 999px;
      background: rgba(245, 166, 35, 0.12);
      color: var(--accent);
    }

    .notes-tab.active .notes-tab-count {
      background: var(--accent);
      color: #0b0906;
      font-weight: 600;
    }

    [data-theme="light"] .notes-tab.active .notes-tab-count {
      color: #fff;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .note-card,
    .notes-empty {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
    }

    .note-card {
      padding: 1.15rem 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.9rem;
      transition: border-color 0.15s ease;
    }

    .note-card:hover {
      border-color: rgba(245, 176, 65, 0.42);
    }

    .note-info {
      min-width: 0;
      flex: 1 1 240px;
    }

    .note-info h3 {
      font-size: 1rem;
      margin-bottom: 0.2rem;
      word-break: break-word;
    }

    .note-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .notes-empty {
      padding: 1.6rem 1.3rem;
      color: var(--text-muted);
      font-size: 0.92rem;
      text-align: center;
    }

    /* Footer */
    footer {
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .nav-links {
        gap: 0.8rem;
        font-size: 0.83rem;
        flex-wrap: wrap;
      }
      .hero {
        padding-top: 2.75rem;
      }
      .note-card {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <header>
    <div class="nav-container">
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="index.html#research">Research</a>
        <a href="index.html#experience">Experience</a>
        <a href="index.html#education">Education</a>
        <a href="notes.html" class="active" aria-current="page">Notes</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">Light Mode</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <span class="hero-tag">Physics Study Archive</span>
      <h1>Notes</h1>
      <p class="hero-subtitle">
        Study notes, derivations, and formula sheets organized by subject. Select a category below to browse or download PDFs.
      </p>
    </section>

    <section id="notes" style="padding-top: 1rem;">
      <h2>Subjects</h2>
      <div class="notes-tabs" id="notesTabs" role="tablist" aria-label="Note categories"></div>
      <div class="notes-list" id="notesPanel" role="tabpanel" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <span>&copy; 2026 Tanjeel Rahman</span>
  </footer>

  <script>
    // Theme toggle (persisted across pages)
    const btn = document.getElementById('themeToggle');
    const root = document.documentElement;

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      btn.textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
    }

    try {
      const savedTheme = localStorage.getItem('site-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        applyTheme(savedTheme);
      }
    } catch (e) {}

    btn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('site-theme', next); } catch (e) {}
    });

    // Notes Library (URL-encoded paths for GitHub Pages)
    const NOTES_BASE_DIR = 'My notes';
    const NOTE_CATEGORIES = [
      {
        id: 'math',
        label: 'Math Methods',
        folder: 'Math methods',
        files: [
          {
            file: 'Gamma_and_Beta_functions.pdf',
            title: 'Gamma and Beta Functions'
          }
        ]
      },
      {
        id: 'classical',
        label: 'Classical Mechanics',
        folder: 'Classical Mechanics',
        files: []
      },
      {
        id: 'em',
        label: 'Classical Electrodynamics',
        folder: 'Classical Electrodynamics',
        files: []
      },
      {
        id: 'qm',
        label: 'Quantum Mechanics',
        folder: 'Quantum Mechanics',
        files: []
      },
      {
        id: 'stat',
        label: 'Statistical Mechanics',
        folder: 'Statistical Mechanics',
        files: []
      },
      {
        id: 'gr',
        label: 'General Relativity',
        folder: 'General Relativity',
        files: []
      }
    ];

    function buildNoteUrl(folder, filename) {
      return [NOTES_BASE_DIR, folder, filename]
        .map(encodeURIComponent)
        .join('/');
    }

    function formatNoteTitle(entry) {
      if (entry.title) return entry.title;
      return entry.file
        .replace(/\.pdf$/i, '')
        .replace(/[_-]+/g, ' ')
        .trim();
    }

    // =========================================================================
    // Dynamic Topic-Based 2D Canvas Backgrounds (Only ONE active scene at once)
    // =========================================================================
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W = 0;
    let H = 0;
    let activeSceneId = 'math';
    let switchTimer = null;

    // --- 1. Math Methods: Conformal Harmonic Grid & Lissajous Curves ---
    const mathScene = {
      nodes: [],
      init(w, h) {
        this.nodes = Array.from({ length: 24 }, (_, i) => ({
          phase: (i / 24) * Math.PI * 2,
          freqA: 2 + (i % 3),
          freqB: 3 + ((i + 1) % 3),
          scale: 0.45 + (i % 4) * 0.14
        }));
      },
      render(c, w, h, isDark, time) {
        const t = time * 0.00045;
        const cx = w * 0.5;
        const cy = h * 0.5;
        const unit = Math.min(w, h) * 0.36;

        // Soft golden analytical glow
        const glow = c.createRadialGradient(cx, cy, 10, cx, cy, unit * 2.1);
        if (isDark) {
          glow.addColorStop(0, 'rgba(245, 166, 35, 0.16)');
          glow.addColorStop(0.5, 'rgba(180, 68, 12, 0.06)');
          glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else {
          glow.addColorStop(0, 'rgba(217, 119, 6, 0.13)');
          glow.addColorStop(0.6, 'rgba(245, 158, 11, 0.04)');
          glow.addColorStop(1, 'rgba(251, 249, 245, 0)');
        }
        c.fillStyle = glow;
        c.fillRect(0, 0, w, h);

        // Gently warped conformal grid lines
        const cols = 14;
        const rows = 10;
        c.lineWidth = 1;
        c.strokeStyle = isDark ? 'rgba(245, 176, 65, 0.09)' : 'rgba(180, 83, 9, 0.1)';
        for (let i = 0; i <= cols; i++) {
          const baseX = (i / cols) * w;
          c.beginPath();
          for (let j = 0; j <= 36; j++) {
            const y = (j / 36) * h;
            const dx = Math.sin(y * 0.006 + t * 1.4 + i * 0.45) * 22;
            const dy = Math.cos(baseX * 0.005 - t + j * 0.2) * 8;
            if (j === 0) c.moveTo(baseX + dx, y + dy);
            else c.lineTo(baseX + dx, y + dy);
          }
          c.stroke();
        }
        for (let j = 0; j <= rows; j++) {
          const baseY = (j / rows) * h;
          c.beginPath();
          for (let i = 0; i <= 40; i++) {
            const x = (i / 40) * w;
            const dy = Math.cos(x * 0.0055 + t * 1.2 + j * 0.5) * 22;
            const dx = Math.sin(baseY * 0.006 + t + i * 0.15) * 8;
            if (i === 0) c.moveTo(x + dx, baseY + dy);
            else c.lineTo(x + dx, baseY + dy);
          }
          c.stroke();
        }

        // Layered morphing harmonic Lissajous / rose curves
        c.save();
        c.translate(cx, cy);
        c.globalCompositeOperation = isDark ? 'lighter' : 'source-over';
        const layers = [
          { a: 3, b: 2, rx: unit * 1.25, ry: unit * 0.85, delta: t * 0.8, alpha: isDark ? 0.3 : 0.22, lw: 1.8 },
          { a: 4, b: 3, rx: unit * 1.0, ry: unit * 0.72, delta: -t * 0.65 + 1.1, alpha: isDark ? 0.24 : 0.17, lw: 1.4 },
          { a: 5, b: 4, rx: unit * 0.75, ry: unit * 0.56, delta: t * 0.5 + 2.2, alpha: isDark ? 0.2 : 0.14, lw: 1.1 }
        ];
        for (const l of layers) {
          c.beginPath();
          const steps = 220;
          for (let s = 0; s <= steps; s++) {
            const u = (s / steps) * Math.PI * 2;
            const x = Math.sin(l.a * u + l.delta) * l.rx;
            const y = Math.sin(l.b * u) * l.ry;
            if (s === 0) c.moveTo(x, y);
            else c.lineTo(x, y);
          }
          c.strokeStyle = isDark
            ? `rgba(255, 198, 92, ${l.alpha})`
            : `rgba(194, 106, 10, ${l.alpha})`;
          c.lineWidth = l.lw;
          c.stroke();
        }

        // Traveling phase nodes along primary harmonic curves
        for (const n of this.nodes) {
          const u = n.phase + t * 0.45;
          const x = Math.sin(n.freqA * u + t * 0.7) * unit * 1.12 * n.scale;
          const y = Math.sin(n.freqB * u) * unit * 0.78 * n.scale;
          c.beginPath();
          c.arc(x, y, 2.2, 0, Math.PI * 2);
          c.fillStyle = isDark ? 'rgba(255, 226, 155, 0.55)' : 'rgba(180, 83, 9, 0.42)';
          c.fill();
        }
        c.restore();
      }
    };

    // --- 2. Classical Mechanics: Keplerian Orbits & Phase-Space Portrait ---
    const classicalScene = {
      orbits: [],
      init(w, h) {
        const base = Math.min(w, h) * 0.14;
        this.orbits = [
          { a: base * 1.1, e: 0.22, tilt: -0.22, angle: 0.4, speed: 0.018, r: 3.0 },
          { a: base * 1.65, e: 0.34, tilt: 0.15, angle: 2.1, speed: 0.012, r: 3.6 },
          { a: base * 2.25, e: 0.28, tilt: -0.35, angle: 4.3, speed: 0.0085, r: 4.0 },
          { a: base * 2.9, e: 0.42, tilt: 0.28, angle: 1.0, speed: 0.006, r: 3.4 },
          { a: base * 3.55, e: 0.18, tilt: -0.1, angle: 3.5, speed: 0.0045, r: 2.8 }
        ];
      },
      render(c, w, h, isDark, time) {
        const cx = w * 0.5;
        const cy = h * 0.5;
        const t = time * 0.0003;

        // Subtle pendulum phase-space streamlines in the background
        c.save();
        c.strokeStyle = isDark ? 'rgba(245, 166, 35, 0.065)' : 'rgba(180, 83, 9, 0.075)';
        c.lineWidth = 1;
        const energies = [-0.6, -0.2, 0.25, 0.7, 1.0, 1.45, 2.1];
        for (const E of energies) {
          for (const sign of [-1, 1]) {
            c.beginPath();
            let started = false;
            for (let i = 0; i <= 140; i++) {
              const x = (i / 140) * w;
              const q = ((x - cx) / (w * 0.14)) + t * 0.3;
              const v2 = 2 * (E + Math.cos(q));
              if (v2 >= 0) {
                const y = cy + sign * Math.sqrt(v2) * (h * 0.155);
                if (!started) { c.moveTo(x, y); started = true; }
                else c.lineTo(x, y);
              } else {
                started = false;
              }
            }
            c.stroke();
          }
        }
        c.restore();

        // Central gravitational focus glow
        const core = c.createRadialGradient(cx, cy, 2, cx, cy, Math.min(w, h) * 0.32);
        if (isDark) {
          core.addColorStop(0, 'rgba(255, 232, 168, 0.65)');
          core.addColorStop(0.12, 'rgba(245, 166, 35, 0.28)');
          core.addColorStop(0.5, 'rgba(180, 65, 12, 0.08)');
          core.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else {
          core.addColorStop(0, 'rgba(217, 119, 6, 0.42)');
          core.addColorStop(0.25, 'rgba(245, 158, 11, 0.14)');
          core.addColorStop(1, 'rgba(251, 249, 245, 0)');
        }
        c.fillStyle = core;
        c.beginPath();
        c.arc(cx, cy, Math.min(w, h) * 0.32, 0, Math.PI * 2);
        c.fill();

        // Keplerian elliptical orbits & bodies (true 1/r^2 angular speed)
        c.save();
        c.translate(cx, cy);
        for (const o of this.orbits) {
          c.save();
          c.rotate(o.tilt + t * 0.08);
          const b = o.a * Math.sqrt(1 - o.e * o.e);
          const focalShift = o.a * o.e;

          // Elliptical path
          c.beginPath();
          c.ellipse(-focalShift, 0, o.a, b, 0, 0, Math.PI * 2);
          c.strokeStyle = isDark ? 'rgba(245, 176, 65, 0.2)' : 'rgba(180, 83, 9, 0.2)';
          c.lineWidth = 1.1;
          c.stroke();

          // Keplerian radius r(theta) = a(1-e^2) / (1 + e cos(theta))
          const p = o.a * (1 - o.e * o.e);
          const rNow = p / (1 + o.e * Math.cos(o.angle));
          const speedScale = Math.pow(o.a / rNow, 1.5);
          o.angle += o.speed * speedScale;

          // Fading orbital trail behind the body
          const trailSteps = 28;
          for (let s = 0; s < trailSteps; s++) {
            const a1 = o.angle - s * 0.045;
            const a2 = o.angle - (s + 1) * 0.045;
            const r1 = p / (1 + o.e * Math.cos(a1));
            const r2 = p / (1 + o.e * Math.cos(a2));
            const alpha = (1 - s / trailSteps) * (isDark ? 0.55 : 0.4);
            c.beginPath();
            c.moveTo(r1 * Math.cos(a1), r1 * Math.sin(a1));
            c.lineTo(r2 * Math.cos(a2), r2 * Math.sin(a2));
            c.strokeStyle = isDark ? `rgba(255, 206, 110, ${alpha})` : `rgba(194, 106, 10, ${alpha})`;
            c.lineWidth = 2.2 * (1 - s / trailSteps) + 0.5;
            c.stroke();
          }

          // Orbiting body
          const bx = rNow * Math.cos(o.angle);
          const by = rNow * Math.sin(o.angle);
          c.beginPath();
          c.arc(bx, by, o.r, 0, Math.PI * 2);
          c.fillStyle = isDark ? '#ffe3a3' : '#b45309';
          c.fill();
          c.restore();
        }

        // Central focus point
        c.beginPath();
        c.arc(0, 0, 5.5, 0, Math.PI * 2);
        c.fillStyle = isDark ? '#fff1c9' : '#c26a0a';
        c.fill();
        c.restore();
      }
    };

    // --- 3. Classical Electrodynamics: Dipole Field Lines & EM Wave Rings ---
    const emScene = {
      pulses: [],
      init() {
        this.pulses = Array.from({ length: 28 }, (_, i) => ({
          shell: 0.45 + (i % 7) * 0.24,
          side: i % 2 === 0 ? 1 : -1,
          theta: Math.random() * Math.PI,
          speed: 0.008 + (i % 4) * 0.0025
        }));
      },
      render(c, w, h, isDark, time) {
        const cx = w * 0.5;
        const cy = h * 0.5;
        const scale = Math.min(w, h) * 0.34;
        const t = time * 0.0005;

        c.save();
        c.translate(cx, cy);
        c.rotate(-0.18 + Math.sin(t * 0.6) * 0.06);

        // Radiating electromagnetic wavefront rings
        for (let i = 0; i < 5; i++) {
          const prog = (t * 0.45 + i / 5) % 1;
          const rad = prog * Math.max(w, h) * 0.62;
          const alpha = (1 - prog) * (isDark ? 0.14 : 0.11);
          c.beginPath();
          c.arc(0, 0, rad, 0, Math.PI * 2);
          c.strokeStyle = isDark ? `rgba(245, 166, 35, ${alpha})` : `rgba(180, 83, 9, ${alpha})`;
          c.lineWidth = 1.2;
          c.stroke();
        }

        // Dipole field lines: r = R_max * sin^2(theta)
        c.globalCompositeOperation = isDark ? 'lighter' : 'source-over';
        const shells = [0.45, 0.69, 0.93, 1.17, 1.41, 1.65, 1.89];
        for (const sh of shells) {
          const R = scale * sh;
          const alpha = isDark ? (0.3 - sh * 0.09) : (0.24 - sh * 0.07);
          c.strokeStyle = isDark
            ? `rgba(255, 184, 66, ${Math.max(0.08, alpha)})`
            : `rgba(194, 106, 10, ${Math.max(0.07, alpha)})`;
          c.lineWidth = 1.25;

          for (const side of [-1, 1]) {
            c.beginPath();
            for (let s = 0; s <= 90; s++) {
              const th = (s / 90) * Math.PI;
              const r = R * Math.sin(th) * Math.sin(th);
              const x = side * r * Math.sin(th);
              const y = -r * Math.cos(th);
              if (s === 0) c.moveTo(x, y);
              else c.lineTo(x, y);
            }
            c.stroke();
          }
        }

        // Luminous flux pulses gliding along dipole field lines
        for (const p of this.pulses) {
          p.theta += p.speed;
          if (p.theta >= Math.PI - 0.06) p.theta = 0.06;
          const R = scale * p.shell;
          const r = R * Math.sin(p.theta) * Math.sin(p.theta);
          const x = p.side * r * Math.sin(p.theta);
          const y = -r * Math.cos(p.theta);
          const fade = Math.sin(p.theta);

          c.beginPath();
          c.arc(x, y, 2.4, 0, Math.PI * 2);
          c.fillStyle = isDark
            ? `rgba(255, 232, 170, ${fade * 0.85})`
            : `rgba(180, 83, 9, ${fade * 0.65})`;
          c.fill();
        }

        // Dipole core glow
        const poleGlow = c.createRadialGradient(0, 0, 2, 0, 0, scale * 0.55);
        if (isDark) {
          poleGlow.addColorStop(0, 'rgba(255, 238, 190, 0.72)');
          poleGlow.addColorStop(0.3, 'rgba(245, 166, 35, 0.25)');
          poleGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else {
          poleGlow.addColorStop(0, 'rgba(217, 119, 6, 0.35)');
          poleGlow.addColorStop(0.5, 'rgba(245, 158, 11, 0.1)');
          poleGlow.addColorStop(1, 'rgba(251, 249, 245, 0)');
        }
        c.fillStyle = poleGlow;
        c.beginPath();
        c.arc(0, 0, scale * 0.55, 0, Math.PI * 2);
        c.fill();

        c.restore();
      }
    };

    // --- 4. Quantum Mechanics: Superposition Wave Packets & |psi|^2 ---
    const qmScene = {
      quanta: [],
      init(w, h) {
        this.quanta = Array.from({ length: 42 }, () => ({
          nx: Math.random(),
          phase: Math.random() * Math.PI * 2,
          speed: 0.015 + Math.random() * 0.025,
          r: 1.4 + Math.random() * 2.0
        }));
      },
      render(c, w, h, isDark, time) {
        const t = time * 0.0012;
        const cy = h * 0.52;
        const amp = Math.min(h * 0.2, 130);

        // Ambient quantum core glow
        const glow = c.createRadialGradient(w * 0.5, cy, 10, w * 0.5, cy, Math.max(w, h) * 0.5);
        if (isDark) {
          glow.addColorStop(0, 'rgba(245, 166, 35, 0.16)');
          glow.addColorStop(0.45, 'rgba(180, 62, 12, 0.06)');
          glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else {
          glow.addColorStop(0, 'rgba(217, 119, 6, 0.12)');
          glow.addColorStop(1, 'rgba(251, 249, 245, 0)');
        }
        c.fillStyle = glow;
        c.fillRect(0, 0, w, h);

        // Probability density envelope |psi(x,t)|^2 (filled translucent wave)
        const steps = 160;
        const packetCenter = 0.5 + Math.sin(t * 0.42) * 0.16;
        const sigma = 0.24;

        function psiReal(nx) {
          const dx = nx - packetCenter;
          const env = Math.exp(-(dx * dx) / (2 * sigma * sigma));
          return env * (Math.cos(26 * nx - t * 2.2) * 0.65 + Math.cos(15 * nx + t * 1.4) * 0.35);
        }

        function psiImag(nx) {
          const dx = nx - packetCenter;
          const env = Math.exp(-(dx * dx) / (2 * sigma * sigma));
          return env * (Math.sin(26 * nx - t * 2.2) * 0.65 + Math.sin(15 * nx + t * 1.4) * 0.35);
        }

        // Draw probability density cloud |psi|^2
        c.beginPath();
        c.moveTo(0, cy);
        for (let i = 0; i <= steps; i++) {
          const nx = i / steps;
          const re = psiReal(nx);
          const im = psiImag(nx);
          const prob = re * re + im * im;
          c.lineTo(nx * w, cy - prob * amp * 1.35);
        }
        c.lineTo(w, cy);
        c.closePath();
        const fillGrad = c.createLinearGradient(0, cy - amp * 1.4, 0, cy);
        if (isDark) {
          fillGrad.addColorStop(0, 'rgba(255, 214, 122, 0.24)');
          fillGrad.addColorStop(1, 'rgba(245, 166, 35, 0.02)');
        } else {
          fillGrad.addColorStop(0, 'rgba(194, 106, 10, 0.18)');
          fillGrad.addColorStop(1, 'rgba(194, 106, 10, 0.01)');
        }
        c.fillStyle = fillGrad;
        c.fill();

        // Draw Re(psi), Im(psi), and harmonic standing modes
        c.save();
        c.globalCompositeOperation = isDark ? 'lighter' : 'source-over';

        // Standing harmonic background waves
        for (let mode = 1; mode <= 3; mode++) {
          c.beginPath();
          for (let i = 0; i <= steps; i++) {
            const nx = i / steps;
            const y = cy + Math.sin(nx * Math.PI * (mode * 2 + 1)) * Math.cos(t * (0.7 + mode * 0.25)) * (amp * 0.45 / mode);
            if (i === 0) c.moveTo(nx * w, y);
            else c.lineTo(nx * w, y);
          }
          c.strokeStyle = isDark ? 'rgba(245, 166, 35, 0.14)' : 'rgba(180, 83, 9, 0.12)';
          c.lineWidth = 1;
          c.stroke();
        }

        // Re(psi)
        c.beginPath();
        for (let i = 0; i <= steps; i++) {
          const nx = i / steps;
          const y = cy - psiReal(nx) * amp;
          if (i === 0) c.moveTo(nx * w, y);
          else c.lineTo(nx * w, y);
        }
        c.strokeStyle = isDark ? 'rgba(255, 224, 148, 0.62)' : 'rgba(194, 106, 10, 0.5)';
        c.lineWidth = 1.9;
        c.stroke();

        // Im(psi)
        c.beginPath();
        for (let i = 0; i <= steps; i++) {
          const nx = i / steps;
          const y = cy - psiImag(nx) * amp * 0.9;
          if (i === 0) c.moveTo(nx * w, y);
          else c.lineTo(nx * w, y);
        }
        c.strokeStyle = isDark ? 'rgba(245, 146, 30, 0.42)' : 'rgba(180, 83, 9, 0.34)';
        c.lineWidth = 1.4;
        c.stroke();

        // Shimmering quantized probability sparks weighted by |psi|^2
        for (const q of this.quanta) {
          q.phase += q.speed;
          const re = psiReal(q.nx);
          const im = psiImag(q.nx);
          const prob = re * re + im * im;
          const twinkle = (0.5 + 0.5 * Math.sin(q.phase)) * Math.min(1, prob * 2.2 + 0.12);
          const y = cy - re * amp * 0.85 + Math.sin(q.phase * 0.7) * 18;
          c.beginPath();
          c.arc(q.nx * w, y, q.r, 0, Math.PI * 2);
          c.fillStyle = isDark
            ? `rgba(255, 236, 180, ${twinkle * 0.75})`
            : `rgba(194, 106, 10, ${twinkle * 0.55})`;
          c.fill();
        }
        c.restore();
      }
    };

    // --- 5. Statistical Mechanics: Maxwell-Boltzmann Thermal Ensemble ---
    const statScene = {
      particles: [],
      init(w, h) {
        const count = Math.min(78, Math.max(42, Math.floor((w * h) / 18000)));
        this.particles = Array.from({ length: count }, () => {
          // Approximate Maxwell-Boltzmann speed spread
          const u = (Math.random() + Math.random() + Math.random()) / 3;
          const speed = 0.25 + u * 1.45;
          const dir = Math.random() * Math.PI * 2;
          return {
            x: Math.random() * w,
            y: Math.random() * h,
            vx: Math.cos(dir) * speed,
            vy: Math.sin(dir) * speed,
            energy: u,
            r: 1.6 + u * 2.1
          };
        });
      },
      render(c, w, h, isDark, time) {
        const t = time * 0.0005;

        // Subtle Maxwell-Boltzmann distribution curve along the lower viewport
        c.beginPath();
        const baseY = h * 0.88;
        const maxH = h * 0.26;
        for (let i = 0; i <= 120; i++) {
          const v = (i / 120) * 4.2;
          const tempShift = 1 + Math.sin(t) * 0.08;
          const fv = (v * v) * Math.exp(-(v * v) / (1.8 * tempShift)) * 1.45;
          const x = (i / 120) * w;
          const y = baseY - fv * maxH;
          if (i === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.strokeStyle = isDark ? 'rgba(245, 166, 35, 0.14)' : 'rgba(180, 83, 9, 0.14)';
        c.lineWidth = 1.4;
        c.stroke();

        // Update & draw particles + short-range thermal interaction links
        const linkDist = 115;
        const linkDistSq = linkDist * linkDist;
        const pts = this.particles;

        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x += w;
          else if (p.x > w) p.x -= w;
          if (p.y < 0) p.y += h;
          else if (p.y > h) p.y -= h;
        }

        c.save();
        c.globalCompositeOperation = isDark ? 'lighter' : 'source-over';
        c.lineWidth = 1;
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i];
          for (let j = i + 1; j < pts.length; j++) {
            const b = pts[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < linkDistSq) {
              const alpha = (1 - Math.sqrt(d2) / linkDist) * (isDark ? 0.2 : 0.15);
              c.beginPath();
              c.moveTo(a.x, a.y);
              c.lineTo(b.x, b.y);
              c.strokeStyle = isDark ? `rgba(245, 176, 65, ${alpha})` : `rgba(180, 83, 9, ${alpha})`;
              c.stroke();
            }
          }
        }

        for (const p of pts) {
          const g = Math.floor(125 + p.energy * 115);
          const b = Math.floor(20 + p.energy * p.energy * 150);
          const alpha = isDark ? (0.45 + p.energy * 0.45) : (0.35 + p.energy * 0.35);

          // Soft thermal halo
          c.beginPath();
          c.arc(p.x, p.y, p.r * 3.2, 0, Math.PI * 2);
          c.fillStyle = isDark
            ? `rgba(255, ${g}, ${b}, ${alpha * 0.14})`
            : `rgba(194, 106, 10, ${alpha * 0.1})`;
          c.fill();

          // Particle core
          c.beginPath();
          c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          c.fillStyle = isDark
            ? `rgba(255, ${g}, ${b}, ${alpha})`
            : `rgba(180, 83, 9, ${alpha})`;
          c.fill();
        }
        c.restore();
      }
    };

    // --- 6. General Relativity: Existing 2D Swirling Black Hole ---
    const grScene = {
      stars: [],
      diskRibbons: [],
      lensedRibbons: [],
      bh: { x: 0, y: 0, r: 140, tilt: -0.15 },
      init(w, h) {
        this.bh.x = w * 0.5;
        this.bh.y = h * 0.45;
        this.bh.r = Math.min(165, Math.max(85, Math.min(w, h) * 0.185));

        const count = Math.floor((w * h) / 14000);
        this.stars = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.2 + 0.25,
          alpha: Math.random() * 0.5 + 0.12
        }));

        this.diskRibbons = [];
        for (let i = 0; i < 85; i++) {
          const t = Math.pow(i / 85, 1.35);
          this.diskRibbons.push({
            radius: this.bh.r * (1.12 + t * 4.2),
            angle: Math.random() * Math.PI * 2,
            arcLen: 1.4 + Math.random() * 2.8,
            speed: 0.003 + (1 - t) * 0.011,
            width: (1 - t) * 28 + 14,
            heat: 1 - t,
            alphaBase: 0.035 + (1 - t) * 0.065
          });
        }

        this.lensedRibbons = [];
        for (let i = 0; i < 40; i++) {
          const t = Math.pow(i / 40, 1.5);
          this.lensedRibbons.push({
            radius: this.bh.r * (1.03 + t * 0.78),
            angle: Math.random() * Math.PI * 2,
            arcLen: 1.8 + Math.random() * 2.6,
            speed: 0.004 + (1 - t) * 0.009,
            width: (1 - t) * 20 + 8,
            heat: 1 - t,
            alphaBase: 0.03 + (1 - t) * 0.055
          });
        }
      },
      drawLensedHalo(c, isDark) {
        const bh = this.bh;
        c.save();
        c.translate(bh.x, bh.y);
        c.rotate(bh.tilt);

        const outerGlow = c.createRadialGradient(-bh.r * 0.2, 0, bh.r * 0.9, 0, 0, bh.r * 4.5);
        if (isDark) {
          outerGlow.addColorStop(0, 'rgba(255, 228, 160, 0.48)');
          outerGlow.addColorStop(0.2, 'rgba(245, 158, 11, 0.24)');
          outerGlow.addColorStop(0.52, 'rgba(180, 58, 12, 0.08)');
          outerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else {
          outerGlow.addColorStop(0, 'rgba(217, 119, 6, 0.24)');
          outerGlow.addColorStop(0.3, 'rgba(245, 158, 11, 0.1)');
          outerGlow.addColorStop(1, 'rgba(251, 249, 245, 0)');
        }
        c.beginPath();
        c.arc(0, 0, bh.r * 4.5, 0, Math.PI * 2);
        c.fillStyle = outerGlow;
        c.fill();

        c.globalCompositeOperation = isDark ? 'lighter' : 'source-over';
        for (const p of this.lensedRibbons) {
          const r = 255;
          const g = Math.floor(125 + p.heat * 115);
          const b = Math.floor(22 + Math.pow(p.heat, 2) * 145);
          const alpha = isDark ? p.alphaBase : p.alphaBase * 0.55;

          c.beginPath();
          c.arc(0, 0, p.radius, p.angle, p.angle + p.arcLen);
          c.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          c.lineWidth = p.width;
          c.lineCap = 'round';
          c.stroke();
        }
        c.restore();
      },
      drawDiskHalf(c, frontHalf, isDark) {
        const bh = this.bh;
        c.save();
        c.translate(bh.x, bh.y);
        c.rotate(bh.tilt);

        const clipSize = bh.r * 7;
        c.beginPath();
        if (frontHalf) c.rect(-clipSize, 0, clipSize * 2, clipSize);
        else c.rect(-clipSize, -clipSize, clipSize * 2, clipSize);
        c.clip();

        c.scale(1, 0.26);

        const diskGrad = c.createRadialGradient(-bh.r * 0.65, 0, bh.r * 0.95, 0, 0, bh.r * 5.6);
        if (isDark) {
          diskGrad.addColorStop(0, 'rgba(255, 242, 200, 0.55)');
          diskGrad.addColorStop(0.22, 'rgba(255, 172, 42, 0.36)');
          diskGrad.addColorStop(0.55, 'rgba(205, 70, 12, 0.14)');
          diskGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else {
          diskGrad.addColorStop(0, 'rgba(217, 119, 6, 0.28)');
          diskGrad.addColorStop(0.4, 'rgba(245, 158, 11, 0.12)');
          diskGrad.addColorStop(1, 'rgba(251, 249, 245, 0)');
        }
        c.beginPath();
        c.arc(0, 0, bh.r * 5.6, 0, Math.PI * 2);
        c.fillStyle = diskGrad;
        c.fill();

        c.globalCompositeOperation = isDark ? 'lighter' : 'source-over';
        for (const p of this.diskRibbons) {
          const midAngle = p.angle + p.arcLen * 0.5;
          const doppler = 0.65 + 0.45 * (-Math.cos(midAngle));
          const intensity = Math.min(1, p.heat * 0.9 + 0.15) * doppler;

          const r = 255;
          const g = Math.floor(100 + intensity * 145);
          const b = Math.floor(15 + Math.pow(intensity, 2.2) * 175);
          const alpha = (isDark ? p.alphaBase : p.alphaBase * 0.5) * doppler;

          c.beginPath();
          c.arc(0, 0, p.radius, p.angle, p.angle + p.arcLen);
          c.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          c.lineWidth = p.width;
          c.lineCap = 'round';
          c.stroke();
        }
        c.restore();
      },
      drawEventHorizon(c, isDark, time) {
        const bh = this.bh;
        c.save();
        c.translate(bh.x, bh.y);

        c.beginPath();
        c.arc(0, 0, bh.r, 0, Math.PI * 2);
        c.fillStyle = isDark ? '#020203' : '#110e0c';
        c.fill();

        const shimmer = 0.8 + Math.sin(time * 0.0025) * 0.12;
        c.beginPath();
        c.arc(0, 0, bh.r * 1.015, 0, Math.PI * 2);
        c.strokeStyle = isDark
          ? `rgba(255, 236, 185, ${shimmer})`
          : `rgba(217, 119, 6, ${shimmer * 0.65})`;
        c.lineWidth = 2.6;
        c.stroke();
        c.restore();
      },
      render(c, w, h, isDark, time) {
        const starRGB = isDark ? '255, 240, 215' : '120, 80, 40';
        for (const s of this.stars) {
          c.beginPath();
          c.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          c.fillStyle = `rgba(${starRGB}, ${isDark ? s.alpha : s.alpha * 0.2})`;
          c.fill();
        }
        for (const p of this.diskRibbons) p.angle += p.speed;
        for (const p of this.lensedRibbons) p.angle += p.speed;

        this.drawLensedHalo(c, isDark);
        this.drawDiskHalf(c, false, isDark);
        this.drawEventHorizon(c, isDark, time);
        this.drawDiskHalf(c, true, isDark);
      }
    };

    const SCENES = {
      math: mathScene,
      classical: classicalScene,
      em: emScene,
      qm: qmScene,
      stat: statScene,
      gr: grScene
    };

    function resizeCanvas() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      const scene = SCENES[activeSceneId];
      if (scene && scene.init) scene.init(W, H);
    }

    function switchBackgroundScene(nextId, immediate) {
      if (!SCENES[nextId]) return;
      if (switchTimer) {
        clearTimeout(switchTimer);
        switchTimer = null;
      }
      if (immediate) {
        activeSceneId = nextId;
        SCENES[activeSceneId].init(W, H);
        canvas.style.opacity = '1';
        return;
      }
      if (activeSceneId === nextId) return;
      canvas.style.opacity = '0';
      switchTimer = setTimeout(() => {
        activeSceneId = nextId;
        SCENES[activeSceneId].init(W, H);
        ctx.clearRect(0, 0, W, H);
        canvas.style.opacity = '1';
        switchTimer = null;
      }, 210);
    }

    function animate(time) {
      ctx.clearRect(0, 0, W, H);
      const isDark = root.getAttribute('data-theme') === 'dark';
      const scene = SCENES[activeSceneId];
      if (scene) {
        scene.render(ctx, W, H, isDark, time);
      }
      requestAnimationFrame(animate);
    }

    // =========================================================================
    // Notes Tabs & Panel Rendering
    // =========================================================================
    function initNotesPage() {
      const tabsEl = document.getElementById('notesTabs');
      const panelEl = document.getElementById('notesPanel');
      if (!tabsEl || !panelEl) return;

      let activeIndex = NOTE_CATEGORIES.findIndex(cat => cat.files.length > 0);
      if (activeIndex === -1) activeIndex = 0;

      function renderTabs() {
        tabsEl.innerHTML = '';
        NOTE_CATEGORIES.forEach((category, idx) => {
          const isActive = idx === activeIndex;
          const tab = document.createElement('button');
          tab.type = 'button';
          tab.className = 'notes-tab' + (isActive ? ' active' : '');
          tab.id = `notes-tab-${idx}`;
          tab.setAttribute('role', 'tab');
          tab.setAttribute('aria-selected', String(isActive));
          tab.setAttribute('aria-controls', 'notesPanel');

          const labelSpan = document.createElement('span');
          labelSpan.textContent = category.label;
          tab.appendChild(labelSpan);

          const countSpan = document.createElement('span');
          countSpan.className = 'notes-tab-count';
          countSpan.textContent = String(category.files.length);
          tab.appendChild(countSpan);

          tab.addEventListener('click', () => {
            if (activeIndex === idx) return;
            activeIndex = idx;
            renderTabs();
            renderPanel();
            switchBackgroundScene(category.id, false);
          });

          tabsEl.appendChild(tab);
        });
      }

      function renderPanel() {
        const category = NOTE_CATEGORIES[activeIndex];
        panelEl.innerHTML = '';
        panelEl.setAttribute('aria-labelledby', `notes-tab-${activeIndex}`);

        if (!category || category.files.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'notes-empty';
          empty.textContent = `No notes uploaded in ${category.label} yet.`;
          panelEl.appendChild(empty);
          return;
        }

        category.files.forEach((entry) => {
          const noteUrl = buildNoteUrl(category.folder, entry.file);

          const card = document.createElement('div');
          card.className = 'note-card';

          const info = document.createElement('div');
          info.className = 'note-info';

          const title = document.createElement('h3');
          title.textContent = formatNoteTitle(entry);
          info.appendChild(title);

          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = `PDF \u2022 ${category.label}`;
          info.appendChild(meta);

          const actions = document.createElement('div');
          actions.className = 'note-actions';

          const openLink = document.createElement('a');
          openLink.href = noteUrl;
          openLink.target = '_blank';
          openLink.rel = 'noopener noreferrer';
          openLink.className = 'btn btn-sm btn-primary';
          openLink.textContent = 'Open';
          actions.appendChild(openLink);

          const downloadLink = document.createElement('a');
          downloadLink.href = noteUrl;
          downloadLink.setAttribute('download', entry.file);
          downloadLink.className = 'btn btn-sm';
          downloadLink.textContent = 'Download';
          actions.appendChild(downloadLink);

          card.appendChild(info);
          card.appendChild(actions);
          panelEl.appendChild(card);
        });
      }

      renderTabs();
      renderPanel();
      resizeCanvas();
      switchBackgroundScene(NOTE_CATEGORIES[activeIndex].id, true);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvas);
    initNotesPage();
  </script>
</body>
</html>
